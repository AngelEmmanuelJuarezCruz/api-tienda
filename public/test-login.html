<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - API Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
            <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Login - API Tienda</h1>
            
            <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded">
                <h2 class="font-bold text-blue-900 mb-3">Credenciales de prueba:</h2>
                <div class="space-y-2 text-sm">
                    <p><strong>Dueño:</strong><br>dueno@apitienda.local / password123</p>
                    <p><strong>Encargado:</strong><br>encargado@apitienda.local / password123</p>
                    <p><strong>Cajero:</strong><br>cajero@apitienda.local / password123</p>
                </div>
            </div>

            <form action="http://127.0.0.1:8000/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input 
                        type="email" 
                        name="email" 
                        value="encargado@apitienda.local"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        required
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input 
                        type="password" 
                        name="password" 
                        value="password123"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        required
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition"
                >
                    Iniciar Sesión
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-4">
                Accede a <a href="http://127.0.0.1:8000" class="text-indigo-600 hover:underline">la app aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
